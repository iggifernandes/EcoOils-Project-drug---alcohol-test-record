<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alcohol Test Record · Mentari Project</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
/* ===== EcoOils minimal Shell-style base (shared across all EcoOils apps) ===== */
:root{
  --green:#44a276; --green-tint:#e9f4ee; --yellow:#ffc600; --yellow-tint:#fff6d1;
  --black:#231f20; --white:#fff; --grey:#aaaaaa; --grey-text:#6e6b6c; --line:#dcdcdc; --tint:#f6f6f6;
  --err:#b3261e;
  --font:Jost,system-ui,Arial,sans-serif;
}
*{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{margin:0;background:var(--white);color:var(--black);font-family:var(--font);font-size:16px;font-weight:400;line-height:1.5;overflow-x:hidden;position:relative;}
/* corner watermark: 5 x 5 grey dot grid, behind content */
body::after{content:"";position:fixed;right:-46px;bottom:-46px;width:150px;height:150px;opacity:.3;pointer-events:none;z-index:0;
  background-image:radial-gradient(circle,var(--grey) 0 6px,transparent 6.5px);background-size:30px 30px;}
.hdr,.wrap,main,footer{position:relative;z-index:1;}
a{color:inherit;}
:focus-visible{outline:3px solid var(--green);outline-offset:2px;}

/* header: logo left; version above language toggle on the right */
.hdr-in{max-width:780px;margin:0 auto;padding:14px 16px 0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
.logo{height:44px;width:auto;display:block;}
.hdr-right{display:flex;flex-direction:column;align-items:flex-end;gap:2px;}
.ver{font-size:14px;font-weight:400;color:var(--grey-text);letter-spacing:.06em;}
.lang{display:flex;gap:2px;}
.lang button{font-family:var(--font);font-size:15px;font-weight:500;color:var(--grey-text);background:none;border:0;border-bottom:3px solid transparent;padding:8px 8px 5px;min-height:40px;cursor:pointer;letter-spacing:.04em;}
.lang button[aria-pressed="true"],.lang button.active{color:var(--black);border-bottom-color:var(--green);}
.lang button:hover{color:var(--black);}

/* page title + rule */
.titlebar{max-width:780px;margin:0 auto;position:relative;border-bottom:1px solid var(--black);}
.titlebar::after{content:"";position:absolute;left:16px;bottom:-3px;width:44px;height:7px;background:var(--green);}
.title{margin:0;padding:26px 16px 14px;font-family:var(--font);font-weight:300;font-size:22px;letter-spacing:.14em;text-transform:uppercase;color:var(--grey-text);line-height:1.25;}
.subtitle{margin:0;padding:0 16px 14px;font-size:14px;color:var(--grey-text);}

/* content column */
.wrap{max-width:780px;margin:0 auto;padding:28px 16px 80px;}

/* components */
.card{background:var(--white);border:1px solid var(--line);border-radius:8px;padding:20px;}
.btn{font-family:var(--font);font-size:16px;font-weight:600;min-height:44px;padding:10px 20px;border-radius:8px;border:1px solid var(--green);background:var(--green);color:var(--black);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:background .15s;}
.btn:hover{background:#3b9068;}
.btn:disabled{background:var(--tint);border-color:var(--line);color:var(--grey);cursor:not-allowed;}
.btn.sec{background:var(--white);border-color:var(--line);font-weight:500;}
.btn.sec:hover{border-color:var(--black);background:var(--white);}
.btn.key{background:var(--yellow);border-color:var(--yellow);}
.btn.key:hover{background:#e8b300;}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;border:1px solid var(--line);border-radius:999px;padding:2px 10px;background:var(--white);}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--grey);}
.pill.ok::before{background:var(--green);} .pill.wait::before{background:var(--yellow);} .pill.no::before{background:var(--grey);} .pill.out::before{background:var(--black);}
.dots56{width:56px;height:56px;margin:0 auto 10px;background-image:radial-gradient(circle,var(--grey) 0 2.6px,transparent 3px);background-size:11.2px 11.2px;}
.empty{text-align:center;color:var(--grey-text);font-weight:300;letter-spacing:.14em;text-transform:uppercase;font-size:14px;padding:28px 0;}
@media (max-width:420px){ .title{font-size:18px;letter-spacing:.1em;} .lang button{font-size:14px;} .logo{height:38px;} }
@media print{ body::after{display:none;} }

/* ---------- field app (shared by Blood Pressure and Alcohol) ---------- */
:root{
  /* names used by combobox.css, mapped to the Shell palette */
  --steel:var(--black); --red:var(--err); --ink:var(--black); --paper:var(--tint); --muted:var(--grey-text);
}
.top-links{display:flex;gap:6px;justify-content:flex-end;margin-top:4px;}
.btn.sm{min-height:36px;padding:5px 12px;font-size:14px;font-weight:500;}
.eyebrow{margin:0 0 16px;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--grey-text);}

/* stat tiles */
.stats{display:grid;grid-template-columns:1.2fr repeat(3,1fr);gap:12px;margin-bottom:20px;}
@media (max-width:640px){ .stats{grid-template-columns:1fr 1fr;} }
.stat-card{background:var(--white);border:1px solid var(--line);border-radius:8px;padding:14px 16px;}
.stat-label{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--grey-text);margin:0 0 6px;}
.stat-value,.readout-display{font-size:30px;font-weight:500;line-height:1.1;color:var(--black);}
.readout-display{color:var(--green);}
.readout-caption{font-size:14px;color:var(--grey-text);margin:4px 0 0;min-height:21px;}
.blink-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);margin-right:6px;}

/* cards */
.card{margin-bottom:16px;}
.card h2{font-size:19px;font-weight:500;margin:0 0 4px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.card h2 .num{font-size:13px;font-weight:500;letter-spacing:.06em;color:var(--black);background:var(--yellow-tint);border-radius:6px;padding:1px 8px;}
.card .sub{color:var(--grey-text);font-size:15px;margin:0 0 18px;}

/* form */
form#logForm{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;}
@media (max-width:560px){ form#logForm{grid-template-columns:1fr;} }
.field{display:flex;flex-direction:column;gap:6px;min-width:0;}
.field.span2,.field.span3{grid-column:1/-1;}
label{font-size:13px;font-weight:500;color:var(--grey-text);text-transform:uppercase;letter-spacing:.1em;}
input[type=text],input[type=date],input[type=time],input[type=number],textarea,select{
  font-family:var(--font);font-size:16px;min-height:44px;padding:8px 12px;border:1px solid var(--line);
  border-radius:8px;background:var(--white);color:var(--black);width:100%;transition:border-color .15s;}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--black);box-shadow:0 0 0 2px var(--green);}
.outcome-toggle{display:flex;flex-wrap:wrap;gap:8px;}
.outcome-toggle input{position:absolute;opacity:0;width:0;height:0;}
.outcome-toggle label{flex:1 1 130px;text-align:center;padding:10px 6px;min-height:44px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:8px;cursor:pointer;font-size:16px;font-weight:500;color:var(--black);text-transform:none;letter-spacing:0;background:var(--white);transition:background .15s;}
.outcome-toggle input:focus-visible + label{outline:3px solid var(--green);outline-offset:2px;}
.outcome-toggle input:checked + label{border-color:var(--black);}
.outcome-toggle input[value="Go"]:checked + label,.outcome-toggle input[value="Pass"]:checked + label{background:var(--green);color:var(--black);border-color:var(--green);font-weight:600;}
.outcome-toggle input[value="No Go"]:checked + label,.outcome-toggle input[value="Fail"]:checked + label{background:var(--black);color:var(--white);font-weight:600;}
.outcome-toggle input[value^="N/A"]:checked + label{background:var(--yellow);border-color:var(--yellow);color:var(--black);font-weight:600;}
.form-actions{grid-column:1/-1;display:flex;align-items:center;gap:14px;margin-top:4px;flex-wrap:wrap;}
#formMsg{font-size:15px;color:var(--grey-text);}
#formMsg.ok{color:var(--black);font-weight:600;}
#formMsg.ok::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);margin-right:8px;}
#formMsg.err{color:var(--err);font-weight:600;}
.bp-pair{display:flex;align-items:center;gap:8px;}
.bp-pair input{flex:1;min-width:0;}
.bp-slash{font-weight:500;color:var(--grey-text);font-size:22px;}
.add-inline{display:flex;gap:8px;}
.add-inline select{flex:1;}
.btn-add{font-family:var(--font);font-weight:500;font-size:15px;color:var(--black);background:var(--white);border:1px solid var(--line);border-radius:8px;padding:0 14px;min-height:44px;cursor:pointer;white-space:nowrap;}
.btn-add:hover{border-color:var(--black);}

/* month by contractor */
.contractor-chart{display:flex;flex-direction:column;gap:12px;}
.bar-row{display:grid;grid-template-columns:110px 1fr 36px;align-items:center;gap:10px;}
@media (max-width:600px){ .bar-row{grid-template-columns:92px 1fr 32px;} }
.bar-label{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.bar-track{background:var(--tint);border-radius:4px;height:12px;overflow:hidden;}
.bar-fill{height:100%;border-radius:4px;background:var(--green);transition:width .4s ease;min-width:3px;}
.bar-count{font-weight:600;font-size:15px;text-align:right;}
.chart-empty{text-align:center;color:var(--grey-text);font-weight:300;letter-spacing:.14em;text-transform:uppercase;font-size:14px;padding:18px 0;}
.chart-empty::before{content:"";display:block;width:56px;height:56px;margin:0 auto 10px;background-image:radial-gradient(circle,var(--grey) 0 2.6px,transparent 3px);background-size:11.2px 11.2px;}
footer{text-align:center;color:var(--grey-text);font-size:14px;padding:20px;}

</style>
</head>
<body>

<header class="hdr">
  <div class="hdr-in">
    <img class="logo" src="logo%20(1).png" alt="EcoOils">
    <div class="hdr-right">
      <div class="ver" id="ver"></div>
      <div class="lang" role="group" aria-label="Language">
        <button type="button" class="lang-btn active" data-lang="en" aria-pressed="true">EN</button>
        <button type="button" class="lang-btn" data-lang="bi" aria-pressed="false">ID</button>
        <button type="button" class="lang-btn" data-lang="ms" aria-pressed="false">MS</button>
      </div>
      <div class="top-links"><a class="btn sec sm" id="adminLink" href="https://iggifernandes.github.io/EcoOils-Project-Health-Monitoring/admin.html" data-i18n="admin">Admin</a></div>
    </div>
  </div>
  <div class="titlebar"><h1 class="title" data-i18n="title">Alcohol Test Record</h1></div>
</header>

<main class="wrap">
  <p class="eyebrow"><span data-i18n="eyebrow">PT EcoOils Jaya Indonesia · HSSE</span> · <span data-i18n="subtitle">Mentari Project · Sei Mangkei</span></p>

  <div class="stats">
    <div class="stat-card readout">
      <p class="stat-label"><span class="blink-dot"></span><span data-i18n="livePassRate">Live pass rate</span></p>
      <div class="readout-display" id="readoutPassRate">--.-%</div>
      <p class="readout-caption" id="readoutCaption"></p>
    </div>
    <div class="stat-card">
      <p class="stat-label" data-i18n="totalTests">Total tests logged</p>
      <div class="stat-value" id="statTotal">–</div>
    </div>
    <div class="stat-card">
      <p class="stat-label" data-i18n="failsRefused">Fails / refused</p>
      <div class="stat-value" id="statFails">–</div>
    </div>
    <div class="stat-card">
      <p class="stat-label" data-i18n="loggedMonth">Logged this month</p>
      <div class="stat-value" id="statMonth">–</div>
    </div>
  </div>

  <section class="card">
    <h2><span data-i18n="monthByContractor">This month by contractor</span> <span class="num" id="monthTotalBadge">0</span></h2>
    <p class="sub" id="monthChartSub"></p>
    <div id="contractorChart" class="contractor-chart"></div>
  </section>

  <section class="card">
    <h2><span class="num">NEW</span> <span data-i18n="logTest">Log a test</span></h2>

    <form id="logForm">
      <div class="field">
        <label data-i18n="fDate">Date *</label>
        <input type="date" id="f_date" required>
      </div>
      <div class="field">
        <label data-i18n="fTime">Time *</label>
        <input type="time" id="f_time" required>
      </div>

      <div class="field">
        <label data-i18n="fContractor">Contractor *</label>
        <select id="f_contractor" required>
          <option value="" disabled selected data-i18n="selectContractor">Select contractor…</option>
          <option value="PT PBS">PT PBS</option>
          <option value="PT GSB">PT GSB</option>
          <option value="PT KKS">PT KKS</option>
          <option value="PT WEN">PT WEN</option>
          <option value="__other__" data-i18n="other">Other…</option>
        </select>
        <input type="text" id="f_contractorOther" data-i18n-placeholder="contractorNamePlaceholder" placeholder="Contractor name" style="display:none; margin-top:6px;">
      </div>
      <div class="field">
        <label data-i18n="fEmployee">Employee name *</label>
        <input type="text" id="f_employee" data-i18n-placeholder="fullName" placeholder="Full name" required>
      </div>

      <div class="field">
        <label data-i18n="fEmployeeId">Employee ID (e.g. KTP) *</label>
        <input type="text" id="f_employeeId" data-i18n-placeholder="idPlaceholder" placeholder="ID / permit number" required>
      </div>
      <div class="field">
        <label data-i18n="fPosition">Position *</label>
        <div class="combobox">
          <input type="text" id="f_position_search" data-i18n-placeholder="positionPlaceholder" placeholder="Search position…" autocomplete="off" required>
          <input type="hidden" id="f_position">
          <ul class="combobox-list" id="f_position_list" role="listbox"></ul>
          <span class="combobox-error" id="f_position_error"></span>
        </div>
      </div>
      <div class="field">
        <label data-i18n="fCraft">Craft / Discipline *</label>
        <div class="combobox">
          <input type="text" id="f_craftDiscipline_search" data-i18n-placeholder="craftPlaceholder" placeholder="Search craft / discipline…" autocomplete="off" required>
          <input type="hidden" id="f_craftDiscipline">
          <ul class="combobox-list" id="f_craftDiscipline_list" role="listbox"></ul>
          <span class="combobox-error" id="f_craftDiscipline_error"></span>
        </div>
      </div>
      <div class="field">
        <label data-i18n="fResult">Breathalyzer result *</label>
        <input type="text" id="f_result" placeholder="e.g. 0.00" required>
      </div>

      <div class="field span3">
        <label data-i18n="fOutcome">Result outcome *</label>
        <div class="outcome-toggle">
          <input type="radio" name="outcome" id="o_pass" value="Pass" checked><label for="o_pass" data-i18n="pass">Pass</label>
          <input type="radio" name="outcome" id="o_fail" value="Fail"><label for="o_fail" data-i18n="fail">Fail</label>
          <input type="radio" name="outcome" id="o_na" value="N/A (Refused/Not Completed)"><label for="o_na" data-i18n="na">N/A (Refused / Not Completed)</label>
        </div>
      </div>

      <div class="field">
        <label data-i18n="fTester">Tester's name *</label>
        <input type="text" id="f_tester" data-i18n-placeholder="fullName" placeholder="Full name" required>
      </div>
      <div class="field">
        <label data-i18n="fTesterPosition">Tester's position *</label>
        <input type="text" id="f_testerPosition" data-i18n-placeholder="testerPositionPlaceholder" placeholder="e.g. HSSE Officer" required>
      </div>
      <div class="field">
        <label data-i18n="fNotes">Notes / comments</label>
        <input type="text" id="f_notes" data-i18n-placeholder="optional" placeholder="Optional">
      </div>

      <div class="form-actions">
        <button type="submit" class="btn key" id="submitBtn" data-i18n="logRecordBtn">Log test record</button>
        <span id="formMsg"></span>
      </div>
    </form>

  </section>

</main>

<script src="personnel-lists.js"></script>

      savingSheets: "Menyimpan ke Google Sheets…", loggedOk: "Direkodkan ke Google Sheets ✓",
      unreachable: "Tidak dapat menghubungi Google Sheets — tiada apa disimpan.",
      setUrlFirst: "Tetapkan SHEETS_WEBHOOK_URL dahulu — belum ada tempat untuk menyimpan.",
      testsOnRecord: "ujian dalam rekod",
    }
  };
  let currentLang = "en";
  try { const sl = localStorage.getItem("ecooilsLang"); if(sl && I18N[sl]) currentLang = sl; } catch(e){}
  const HTML_LANG = { en:"en", bi:"id", ms:"ms" };
  function T(){ return I18N[currentLang]; }

  function applyLang(){
    const dict = T();
    document.querySelectorAll('[data-i18n]').forEach(el=>{
      const key = el.dataset.i18n;
      if(dict[key] !== undefined) el.textContent = dict[key];
    });
    document.querySelectorAll('[data-i18n-placeholder]').forEach(el=>{
      const key = el.dataset.i18nPlaceholder;
      if(dict[key] !== undefined) el.placeholder = dict[key];
    });
    document.documentElement.lang = HTML_LANG[currentLang];
    document.querySelectorAll('.lang-btn').forEach(b=>{
      const on = b.dataset.lang===currentLang;
      b.classList.toggle('active', on);
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
    updateStats();
  }

  document.querySelectorAll('.lang-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      currentLang = btn.dataset.lang;
      try { localStorage.setItem("ecooilsLang", currentLang); } catch(e){}
      applyLang();
    });
  });

  let records = [];

  // Baseline totals from the records already submitted (the historical
  // export now pasted into the Google Sheet). Shown immediately on load so
  // the count and pass rate are visible right away; once SHEETS_WEBHOOK_URL
  // is connected, these are replaced with the live figures from the Sheet.
  const BASELINE_STATS = { total: 1089, fails: 0, thisMonth: 42 };

  // "thisMonth" and the breakdown below are a snapshot of August 2026 — they
  // only apply while the page is actually being viewed in that month. Once
  // the calendar rolls to a new month, the fallback correctly shows 0 / no
  // data (rather than freezing on stale numbers) until SHEETS_WEBHOOK_URL is
  // connected and live per-record data takes over for real.
  const BASELINE_MONTH = "2026-08";
  const BASELINE_MONTH_CONTRACTORS = { "PT PBS": 19, "PT KKS": 19, "PT WEN": 4 };

  function normalizeContractor(c){
    const u = (c||"").toUpperCase();
    if(!u.trim()) return "Unspecified";
    if(u.includes("KKS")) return "PT KKS";
    if(u.includes("PBS")) return "PT PBS";
    if(u.includes("GSB")) return "PT GSB";
    if(u.includes("WEN")) return "PT WEN";
    if(u.includes("KOKOH")) return "PT Kokoh Semesta";
    return c.trim();
  }

  function outcomeClass(o){
    if(o==="Pass") return "pass";
    if(o==="Fail") return "fail";
    return "na";
  }

  function renderBars(counts, total){
    const container = document.getElementById('contractorChart');
    document.getElementById('monthTotalBadge').textContent = total.toLocaleString();
    document.getElementById('monthChartSub').textContent = total
      ? `${total} ${T().testsThisMonth}`
      : T().noDataMonth;

    if(total===0){
      container.innerHTML = `<div class="chart-empty">${T().noDataMonth}</div>`;
      return;
    }

    const entries = Object.entries(counts).sort((a,b)=>b[1]-a[1]);
    const max = entries[0][1];

    container.innerHTML = entries.map(([name,count])=>`
      <div class="bar-row">
        <div class="bar-label" title="${name}">${name}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${Math.max(4,(count/max)*100)}%"></div></div>
        <div class="bar-count">${count}</div>
      </div>
    `).join("");
  }

  function renderContractorChart(){
    const now = new Date();
    const ym = now.toISOString().slice(0,7);
    const monthRecords = records.filter(r=>(r.date||"").slice(0,7)===ym);

    const counts = {};
    monthRecords.forEach(r=>{
      const c = normalizeContractor(r.contractor);
      counts[c] = (counts[c]||0) + 1;
    });

    renderBars(counts, monthRecords.length);
  }

  function updateStats(){
    const total = records.length;
    const fails = records.filter(r=>r.outcome!=="Pass").length;
    const passRate = total ? (((total-fails)/total)*100).toFixed(1) : "0.0";
    const now = new Date();
    const ym = now.toISOString().slice(0,7);
    const thisMonth = records.filter(r=>(r.date||"").slice(0,7)===ym).length;

    document.getElementById('statTotal').textContent = total.toLocaleString();
    document.getElementById('statFails').textContent = fails.toLocaleString();
    document.getElementById('statMonth').textContent = thisMonth.toLocaleString();
    document.getElementById('readoutPassRate').textContent = total ? passRate + "%" : "--.-%";
    document.getElementById('readoutCaption').textContent = total ? (total + " " + T().testsOnRecord) : "";
    document.getElementById('readoutPassRate').style.color = fails===0 && total>0 ? "var(--green)" : "var(--black)";
    renderContractorChart();
  }

  function renderBaselineStats(){
    const { total, fails } = BASELINE_STATS;
    const passRate = total ? (((total-fails)/total)*100).toFixed(1) : "0.0";
    const currentYm = new Date().toISOString().slice(0,7);
    const isBaselineMonth = currentYm === BASELINE_MONTH;
    const thisMonth = isBaselineMonth ? BASELINE_STATS.thisMonth : 0;

    document.getElementById('statTotal').textContent = total.toLocaleString();
    document.getElementById('statFails').textContent = fails.toLocaleString();
    document.getElementById('statMonth').textContent = thisMonth.toLocaleString();
    document.getElementById('readoutPassRate').textContent = passRate + "%";
    document.getElementById('readoutCaption').textContent = total + " " + T().testsOnRecord;
    document.getElementById('readoutPassRate').style.color = fails===0 ? "var(--green)" : "var(--black)";
    renderBars(isBaselineMonth ? BASELINE_MONTH_CONTRACTORS : {}, thisMonth);
  }

  async function loadFromSheets(){
    if(!SHEETS_WEBHOOK_URL){
      return;
    }
    try{
      const res = await fetch(SHEETS_WEBHOOK_URL, {method:"GET"});
      const json = await res.json();
      records = Array.isArray(json) ? json : (json.records || []);
    }catch(err){
      // Silent fail for end users — check SHEETS_WEBHOOK_URL / deployment settings if this happens.
    }
    updateStats();
  }

  document.getElementById('f_contractor').addEventListener('change', function(){
    document.getElementById('f_contractorOther').style.display = this.value==="__other__" ? "block" : "none";
  });

  // ── Position / Craft searchable dropdowns (personnel-lists.js)
  const positionWidget = initSearchableSelect({
    inputId: "f_position_search", hiddenId: "f_position", listId: "f_position_list",
    options: POSITION_LIST, errorId: "f_position_error"
  });
  const craftWidget = initSearchableSelect({
    inputId: "f_craftDiscipline_search", hiddenId: "f_craftDiscipline", listId: "f_craftDiscipline_list",
    options: CRAFT_LIST, errorId: "f_craftDiscipline_error"
  });

  // ── Form submit
  const form = document.getElementById('logForm');
  form.addEventListener('submit', async (e)=>{
    e.preventDefault();
    const msg = document.getElementById('formMsg');
    const submitBtn = document.getElementById('submitBtn');
    const outcomeEl = form.querySelector('input[name="outcome"]:checked');

    if(!SHEETS_WEBHOOK_URL){
      msg.textContent = T().setUrlFirst;
      msg.className = "err";
      return;
    }

    const positionOk = positionWidget.validate(T().fPosition.replace(" *","") + " " + T().pickFromList);
    const craftOk = craftWidget.validate(T().fCraft.replace(" *","") + " " + T().pickFromList);
    if(!positionOk || !craftOk){
      msg.textContent = "";
      return;
    }

    const contractorSel = document.getElementById('f_contractor').value;
    const contractor = contractorSel==="__other__" ? document.getElementById('f_contractorOther').value.trim() : contractorSel;

    const rec = {
      date: document.getElementById('f_date').value,
      time: document.getElementById('f_time').value,
      contractor: contractor,
      employee: document.getElementById('f_employee').value.trim(),
      employeeId: document.getElementById('f_employeeId').value.trim(),
      position: document.getElementById('f_position').value,
      craftDiscipline: document.getElementById('f_craftDiscipline').value,
      result: document.getElementById('f_result').value.trim(),
      outcome: outcomeEl ? outcomeEl.value : "Pass",
      tester: document.getElementById('f_tester').value.trim(),
      testerPosition: document.getElementById('f_testerPosition').value.trim(),
      notes: document.getElementById('f_notes').value.trim(),
    };

    submitBtn.disabled = true;
    msg.textContent = T().savingSheets;
    msg.className = "";

    try{
      await fetch(SHEETS_WEBHOOK_URL, {
        method: "POST",
        mode: "no-cors",
        headers: {"Content-Type":"text/plain;charset=utf-8"},
        body: JSON.stringify(rec)
      });
      msg.textContent = T().loggedOk;
      msg.className = "ok";
      form.reset();
      document.getElementById('o_pass').checked = true;
      document.getElementById('f_contractorOther').style.display = "none";
      positionWidget.reset();
      craftWidget.reset();
      await loadFromSheets();
    }catch(err){
      msg.textContent = T().unreachable;
      msg.className = "err";
    }finally{
      submitBtn.disabled = false;
    }
  });

  // ── Init
  renderBaselineStats();
  applyLang();
  loadFromSheets();
})();
</script>
</body>
</html>
